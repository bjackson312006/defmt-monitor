[package]
name = "defmt-monitor"
description = "Publish named values from embedded firmware over defmt, for display in a host-side monitor TUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
defmt-monitor-macros = { workspace = true }

[features]
# Emit monitor frames at `error!` instead of `info!`, so that an aggressive
# `DEFMT_LOG` filter in the application cannot silently discard them.
level-error = ["defmt-monitor-macros/level-error"]
